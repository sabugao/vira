<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vira</title><link rel="icon" href="/vira-favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico"><style>
:root{--cream:#f3eddd;--ink:#17130f;--blue:#2140a2;--orange:#f2522f;--green:#2f895f;--yellow:#f4ba35;--pink:#e99ab0}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}main{position:relative;isolation:isolate;min-height:100svh;padding:clamp(26px,4vw,56px);display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:3}.mark{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:700;letter-spacing:-.03em}.mark svg{width:36px}.soon{font-size:17px;color:rgba(23,19,15,.62)}.hero{align-self:center;position:relative;z-index:2;padding-bottom:38px}h1{margin:0;max-width:900px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(68px,9.6vw,138px);line-height:.88;font-weight:400;letter-spacing:-.07em}.audio{position:relative;z-index:3;display:flex;align-items:center;gap:14px;width:min(410px,100%);padding:13px 17px 13px 13px;border:1px solid rgba(23,19,15,.28);border-radius:999px;background:rgba(243,237,221,.72);backdrop-filter:blur(8px);font-size:17px}.play{width:38px;height:38px;flex:0 0 auto;border:0;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--cream);font-size:13px}.sample{flex:1}.time{color:rgba(23,19,15,.55)}.wave{display:flex;align-items:center;gap:3px;height:18px}.wave i{display:block;width:2px;border-radius:2px;background:var(--ink)}
.art{position:absolute;inset:0;z-index:-1;pointer-events:none}.hill{position:absolute;right:-9vw;bottom:-21vw;width:67vw;height:52vw;background:var(--green);border-radius:53% 47% 0 0/72% 67% 0 0;transform:rotate(-6deg)}.sun{position:absolute;right:22vw;top:10vh;width:13vw;aspect-ratio:1;border-radius:50%;background:var(--yellow)}.blue{position:absolute;right:-4vw;top:20vh;width:37vw;height:15vw;background:var(--blue);border-radius:58% 42% 65% 35%/60% 48% 52% 40%;transform:rotate(-8deg)}.orange{position:absolute;right:8vw;top:31vh;width:23vw;height:7vw;background:var(--orange);border-radius:66% 34% 62% 38%/46% 61% 39% 54%;transform:rotate(14deg)}.pink{position:absolute;right:26vw;bottom:12vh;width:12vw;height:22vw;background:var(--pink);border-radius:54% 46% 48% 52%/70% 62% 38% 30%;transform:rotate(31deg)}
@media(max-width:760px){main{padding:24px}.mark,.soon,.audio{font-size:15px}.mark svg{width:30px}.hero{align-self:start;padding-top:22vh}h1{font-size:clamp(57px,16vw,74px);max-width:350px}.audio{padding:10px 13px 10px 10px;gap:11px}.play{width:34px;height:34px}.hill{width:117vw;height:73vw;right:-42vw;bottom:-26vw}.sun{width:32vw;right:7vw;top:56vh}.blue{width:83vw;height:34vw;right:-27vw;top:63vh}.orange{width:53vw;height:17vw;right:7vw;top:70vh}.pink{width:28vw;height:48vw;right:46vw;bottom:4vh}}
</style></head><body><main><header class="top"><div class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#2140a2"/><path d="M4 24c8-8 20-9 32-3" fill="none" stroke="#f2522f" stroke-width="7" stroke-linecap="round"/></svg><span>vira</span></div><div class="soon">Em breve</div></header><section class="hero"><h1>Seu dinheiro <br>vira conversa</h1></section><div class="audio"><button class="play" aria-label="Ouvir"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg></button><span class="sample">Ouça a Vira dizer oi</span><span class="wave"></span><span class="time">0:11</span><audio src="vira-intro.mp3"></audio></div><div class="art"><i class="sun"></i><i class="blue"></i><i class="orange"></i><i class="pink"></i><i class="hill"></i></div></main><script>const bars=[5,11,8,16,12,7,14,9];document.querySelector('.wave').innerHTML=bars.map(h=>`<i style="height:${h}px"></i>`).join('');const a=document.querySelector('audio'),b=document.querySelector('.play');const P='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>',Q='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" fill="currentColor"/><rect x="7" y="1.5" width="3" height="9" fill="currentColor"/></svg>';b.onclick=()=>{a.paused?(a.play(),b.innerHTML=Q,b.setAttribute('aria-label','Pausar')):(a.pause(),b.innerHTML=P,b.setAttribute('aria-label','Ouvir'))};a.onended=()=>{b.innerHTML=P;b.setAttribute('aria-label','Ouvir')};</script></body></html>
